  leasedb-credentials.json: |
    {
      "type": "mysql",
      "host": "mariadb-maxscale-proxy.db.svc.cluster.local",
      "port": 3306,
      "name": "kea-dhcp",
      "user": "kea",
      "password": "123456-change-password",
      "trust-anchor": "/etc/kea/db/ca.crt",
      "cert-file": "/etc/kea/db/tls.crt",
      "key-file": "/etc/kea/db/tls.key"
    }
  hostsdb-credentials.json: |
    {
      "type": "mysql",
      "host": "mariadb-maxscale-proxy.db.svc.cluster.local",
      "port": 3306,
      "name": "kea-dhcp",
      "user": "kea",
      "password": "123456-change-password",
      "trust-anchor": "/etc/kea/db/ca.crt",
