---
apiVersion: v1
kind: Secret
metadata:
  name: kea-dhcp-setup-script
  namespace: db
type: Opaque
stringData:
  connect.cnf: |
    [client]
    ssl-ca=/etc/kea/db/ca.crt
    ssl-cert=/etc/kea/db/tls.crt
    ssl-key=/etc/kea/db/tls.key
    ssl-mode=REQUIRED
  kea-db-setup.sh: |
    #!/bin/bash
    DB_HOST="mariadb-replication.db.svc.cluster.local"
    DB_PORT="3306"
    DB_USER= "root"
    DB_PW="ab123-change-password"
    DB_NAME="kea-dhcp"
    OPTION_FILE_PATH="/etc/kea/setup/connect.cnf"
    KEA_ADMIN_CMD_ARGS="-h $DB_HOST -P $DB_PORT -u $DB_USER -p $DB_PW -n $DB_NAME -x \"--defaults-file=$OPTION_FILE_PATH\""
    CHECK_KEA_BACKDB_EXIST=`kea-admin db-version mysql -h $KEA_ADMIN_CMD_ARGS`

    if [ $? -eq 0 ];then
      kea-admin db-upgrade mysql $KEA_ADMIN_CMD_ARGS
    else
      kea-admin db-init mysql $KEA_ADMIN_CMD_ARGS
    fi
