apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: metallb-config-pool
  namespace: metallb-system
spec:
  addresses:
  - 192.168.0.10-192.168.0.19
  autoAssign: true
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: metallb-config-l2advert
  namespace: metallb-system
spec:
  ipAddressPools:
  - metallb-config-pool
